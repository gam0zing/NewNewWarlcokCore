license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
NewNewWarlock Modpack's core mod (Minecraft 26.3 / NeoForge build).
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}.bettercombat.mixins.json"

[[mixins]]
config="${mod_id}.neoorigins.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# NeoOrigins is an optional integration: compat features activate only when it is
# present. AFTER ensures its origin / power registries exist before our compat setup.
[[dependencies.${mod_id}]]
    modId="neoorigins"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
