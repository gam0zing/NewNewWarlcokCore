      if (detail.latest_version !== state.remote.baseVersion) {
        showModal('无法上传新版本', [el('div', { text: '远端已经有更新的版本 v' + detail.latest_version + '，而当前工作区基于 v' + state.remote.baseVersion + '。' }), el('div', { text: '请先在「仓库」里拉取最新版本再上传，或把当前工作区作为一棵新树推送。' })], [{ label: '取消' }, { label: '作为新树推送', action: () => { uploadWorkspace('new', author); } }]);
        return;
      }
    } catch (error) { toast('无法检查远端版本：' + error.message, 'error'); return; }
    await uploadWorkspace('version', author);
  }
  async function pullVersion(treeId, version) {
    let detail;
    try { detail = await repoRequest('/api/trees/' + encodeURIComponent(treeId) + '/versions/' + version); } catch (error) { toast('拉取失败：' + error.message, 'error'); return; }
    showModal('拉取 v' + version + ' 到工作区', [el('div', {}, '目标：', el('b', { text: (detail.meta.tree_name || '技能树') + ' v' + version }), '（编辑者：' + (detail.meta.uploader || '未知') + '）'), detail.meta.message ? el('div', { class: 'cmd-summary', text: detail.meta.message }) : null, el('div', { class: 'section-title' }, el('span', {}, '如何处置当前工作区')), el('div', { text: '拉取会替换画布上的全部节点与连线。可以先导出当前工作区作为备份，再执行覆盖。' })], [
      { label: '取消' }, { label: '先备份再覆盖', action: () => { backupWorkspace(); applyRemoteVersion(detail).catch(error => toast('拉取失败：' + error.message, 'error')); } }, { label: '直接覆盖', danger: true, action: () => applyRemoteVersion(detail).catch(error => toast('拉取失败：' + error.message, 'error')) }
    ]);
  }
  async function applyRemoteVersion(detail) {
    applyTreeJson(detail.tree, detail.meta.file_name || null); if (detail.meta.game_tree_id) state.treeId = detail.meta.game_tree_id;
    state.meta = normalizeMeta(detail.tree.meta || { original_author: detail.meta.original_author, version: detail.meta.version, editors: detail.meta.editors, edited_at: detail.meta.edited_at, message: detail.meta.message });
    state.remote = { treeId: detail.meta.tree_id, baseVersion: detail.meta.version, lastSyncedHash: await hashCurrentTree() };
    repoState.dirty = false; syncSettings(); save(); toast('已拉取 v' + detail.meta.version + ' 到工作区', 'ok'); if (isRepoOpen()) { updateRepoWorkspace(); renderRepoVersions(); }
  }
  async function downloadVersion(treeId, version, treeName) {
    try { await repoDownload('/api/trees/' + encodeURIComponent(treeId) + '/versions/' + version + '/download'); toast('已开始下载 ' + treeName + ' v' + version + ' 的 zip', 'ok'); } catch (error) { toast('下载失败：' + error.message, 'error'); }
  }
  async function repoDownload(pathname) {
    const token = repoToken(); if (!token) throw new Error('还没有设置访问令牌');
    const response = await fetch(serverBase() + pathname, { headers: { Authorization: 'Bearer ' + token, 'ngrok-skip-browser-warning': 'true' } });
    if (!response.ok) { let message = 'HTTP ' + response.status; try { const data = await response.json(); if (data && (data.error || data.message)) message = data.error || data.message; } catch (error) {} throw new Error(message); }
    const blob = await response.blob(); const disposition = response.headers.get('Content-Disposition') || ''; const match = /filename\*=UTF-8''([^;]+)/i.exec(disposition); const name = match ? decodeURIComponent(match[1]) : 'skill_tree.zip';
    const url = URL.createObjectURL(blob); const anchor = el('a', { href: url, download: name }); document.body.append(anchor); anchor.click(); anchor.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        treeId: state.treeId, displayName: state.displayName, order: state.order, defaultUnlocked: state.defaultUnlocked, resetXpPerPoint: state.resetXpPerPoint,
        nodes: state.nodes, edges: state.edges, enums: state.enums, commands: Array.from(state.commands.values()), seq: state.seq, meta: state.meta, remote: state.remote
      }));
    } catch (error) { console.warn('保存到 localStorage 失败', error); }
  }

  function load() {
    let raw = null; try { raw = localStorage.getItem(STORAGE_KEY); } catch (error) { raw = null; }
    if (!raw) return false;
    try {
      const data = JSON.parse(raw);
      state.treeId = typeof data.treeId === 'string' ? data.treeId : state.treeId; state.displayName = typeof data.displayName === 'string' ? data.displayName : state.displayName;
      state.order = Number.isInteger(data.order) ? data.order : 0; state.defaultUnlocked = data.defaultUnlocked === true; state.resetXpPerPoint = Number.isFinite(data.resetXpPerPoint) ? data.resetXpPerPoint : 0;
      state.nodes = Array.isArray(data.nodes) ? data.nodes : []; state.edges = Array.isArray(data.edges) ? data.edges : [];
      state.enums = (Array.isArray(data.enums) ? data.enums : []).map(normalizeEnum).filter(Boolean); state.seq = Number.isInteger(data.seq) ? data.seq : 1;
      state.meta = normalizeMeta(data.meta); state.remote = { treeId: data.remote && typeof data.remote.treeId === 'string' ? data.remote.treeId : '', baseVersion: data.remote && Number.isInteger(data.remote.baseVersion) ? data.remote.baseVersion : 0, lastSyncedHash: data.remote && typeof data.remote.lastSyncedHash === 'string' ? data.remote.lastSyncedHash : '' };
      if (Array.isArray(data.commands) && data.commands.length) state.commands = new Map(data.commands.map(def => [def.id, def]));
      return true;
    } catch (error) { console.warn('读取本地草稿失败', error); return false; }
  }

  document.getElementById('btn-defs').addEventListener('click', () => dom.fileDefs.click());
  document.getElementById('btn-enums').addEventListener('click', () => dom.fileEnums.click());
  document.getElementById('btn-import-tree').addEventListener('click', () => dom.fileTree.click());
  document.getElementById('btn-export').addEventListener('click', exportTree);
  document.getElementById('btn-export-pack').addEventListener('click', exportDataPack);
  document.getElementById('btn-help').addEventListener('click', showHelp);
  document.getElementById('btn-upload').addEventListener('click', () => { quickUpload().catch(error => toast('上传失败：' + error.message, 'error')); });
  document.getElementById('btn-repo').addEventListener('click', openRepo);
  
  // 绑定关闭按钮
  document.getElementById('repo-close').addEventListener('click', closeRepo);
  document.getElementById('repo-close-top').addEventListener('click', closeRepo);
  
  document.getElementById('repo-save-config').addEventListener('click', () => { if (saveRepoConfig(false)) refreshTrees().catch(showRepoError); });
  document.getElementById('repo-refresh').addEventListener('click', () => { if (saveRepoConfig(true)) refreshTrees().catch(showRepoError); });
  document.getElementById('repo-push-new').addEventListener('click', () => { uploadWorkspace('new').catch(error => toast('上传失败：' + error.message, 'error')); });
  document.getElementById('repo-push-version').addEventListener('click', () => { if (dom.repoPushVersion.disabled) return; uploadWorkspace('version').catch(error => toast('上传失败：' + error.message, 'error')); });
  dom.repoModal.addEventListener('pointerdown', event => { if (event.target === dom.repoModal) closeRepo(); });

  document.getElementById('btn-new').addEventListener('click', () => {
    showModal('新建技能树', [el('div', { text: '当前草稿会被清空，是否继续？' })], [{ label: '取消' }, {
      label: '新建', primary: true, action: () => {
        state.nodes = []; state.edges = []; state.selection = null; state.connect = null;
        state.treeId = DEFAULT_NAMESPACE + ':skill_tree'; state.displayName = '技能树'; state.order = 0; state.defaultUnlocked = false; state.resetXpPerPoint = 0; state.seq = 1;
        state.meta = { originalAuthor: repoAuthor(), version: 0, editors: [], editedAt: '', message: '' }; state.remote = { treeId: '', baseVersion: 0, lastSyncedHash: '' };
        updateBanner(); renderAll(); fitView(); save();
      }
    }]);
  });

  dom.fileDefs.addEventListener('change', async () => {
    const file = dom.fileDefs.files && dom.fileDefs.files[0]; dom.fileDefs.value = ''; if (!file) return;
    try { loadDefinitions(await readJsonFile(file)); } catch (error) { toast(error.message, 'error'); }
  });
  dom.fileEnums.addEventListener('change', async () => {
    const files = Array.from(dom.fileEnums.files || []); dom.fileEnums.value = ''; if (!files.length) return;
    try { for (const file of files) loadEnums(await readJsonFile(file), true); toast('已加载 ' + files.length + ' 个 enum 文件，共 ' + state.enums.length + ' 条表', 'ok'); } catch (error) { toast(error.message, 'error'); }
  });
  dom.fileTree.addEventListener('change', async () => {
    const file = dom.fileTree.files && dom.fileTree.files[0]; dom.fileTree.value = ''; if (!file) return;
    try { applyTreeJson(await readJsonFile(file), file.name); toast('已导入技能树：' + file.name, 'ok'); } catch (error) { toast(error.message, 'error'); }
  });

  function handleJsonObject(json, filename) {
    if (json && Array.isArray(json.commands)) { loadDefinitions(json); return true; }
    if (json && (Array.isArray(json.enums) || Array.isArray(json.values))) { loadEnums(json); return true; }
    if (json && Array.isArray(json.nodes)) { applyTreeJson(json, filename); toast('已导入技能树：' + filename, 'ok'); return true; }
    return false;
  }
  document.addEventListener('dragover', event => { if (event.dataTransfer && Array.from(event.dataTransfer.types).includes('Files')) event.preventDefault(); });
  document.addEventListener('drop', async event => {
    const files = Array.from((event.dataTransfer && event.dataTransfer.files) || []); if (!files.length) return; event.preventDefault();
    for (const file of files) { try { const json = await readJsonFile(file); if (!handleJsonObject(json, file.name)) toast('无法识别文件：' + file.name, 'error'); } catch (error) { toast(error.message, 'error'); } }
  });

  function boot() {
    const restored = load(); loadBuiltins(); renderLibrary(); renderAll(); updateBanner(); applyView();
    if (state.nodes.length) fitView();
    if (!state.commands.size) {
      fetch('./command_definitions.json', { cache: 'no-store' }).then(response => response.ok ? response.json() : null).then(json => { if (json) loadDefinitions(json, true); }).catch(() => {});
    }
    if (!restored) toast('提示：先导入命令定义，再把命令拖到画布上创建节点', 'ok');
  }

  boot();
})();
</script>
</body>
</html>
