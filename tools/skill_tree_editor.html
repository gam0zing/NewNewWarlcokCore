  // ---------------------------------------------------------------- 内容哈希

  const SHA256_K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];

  function rotr(value, bits) {
    return (value >>> bits) | (value << (32 - bits));
  }

  /** 纯 JS SHA-256，用于 file:// 等没有 crypto.subtle 的场景 */
  function sha256Fallback(text) {
    const bytes = new TextEncoder().encode(text);
    const bitLength = bytes.length * 8;
    const padded = new Uint8Array((((bytes.length + 8) >> 6) + 1) << 6);
    padded.set(bytes);
    padded[bytes.length] = 0x80;
    const view = new DataView(padded.buffer);
    view.setUint32(padded.length - 8, Math.floor(bitLength / 0x100000000));
    view.setUint32(padded.length - 4, bitLength >>> 0);

    const hash = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const w = new Uint32Array(64);

    for (let offset = 0; offset < padded.length; offset += 64) {
      for (let i = 0; i < 16; i += 1) w[i] = view.getUint32(offset + i * 4);
      for (let i = 16; i < 64; i += 1) {
        const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }

      let a = hash[0];
      let b = hash[1];
      let c = hash[2];
      let d = hash[3];
      let e = hash[4];
      let f = hash[5];
      let g = hash[6];
      let h = hash[7];

      for (let i = 0; i < 64; i += 1) {
        const s1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const temp1 = (h + s1 + ch + SHA256_K[i] + w[i]) >>> 0;
        const s0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = (s0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + temp1) >>> 0;
        d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
      }

      hash[0] = (hash[0] + a) >>> 0;
      hash[1] = (hash[1] + b) >>> 0;
      hash[2] = (hash[2] + c) >>> 0;
      hash[3] = (hash[3] + d) >>> 0;
      hash[4] = (hash[4] + e) >>> 0;
      hash[5] = (hash[5] + f) >>> 0;
      hash[6] = (hash[6] + g) >>> 0;
      hash[7] = (hash[7] + h) >>> 0;
    }

    return hash.map(value => value.toString(16).padStart(8, '0')).join('');
  }

  async function hashCurrentTree() {
    const text = canonicalJson(buildCoreTree());
    if (window.crypto && window.crypto.subtle) {
      try {
        const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
      } catch (error) { /* 回退 */ }
    }
    return sha256Fallback(text);
  }

  /** 与服务端一致的键排序 JSON */
  function canonicalJson(value) {
    if (Array.isArray(value)) return '[' + value.map(canonicalJson).join(',') + ']';
    if (value && typeof value === 'object') {
      return '{' + Object.keys(value).sort()
        .map(key => JSON.stringify(key) + ':' + canonicalJson(value[key]))
        .join(',') + '}';
    }
    return JSON.stringify(value) ?? 'null';
  }

  // ---------------------------------------------------------------- HTTP

  async function repoRequest(pathname, options) {
    const token = repoToken();
    if (!token) throw new Error('还没有设置访问令牌，请先在上方填写服务端的 EDITOR_TOKEN');
    const url = serverBase() + pathname;
    let response;
    try {
      response = await fetch(url, {
        method: (options && options.method) || 'GET',
        headers: Object.assign(
          { Authorization: 'Bearer ' + token, 'ngrok-skip-browser-warning': 'true' },
          options && options.body ? { 'Content-Type': 'application/json' } : {}
        ),
        body: options && options.body ? JSON.stringify(options.body) : undefined
      });
    } catch (error) {
      throw new Error('连接服务器失败：' + url + '（' + error.message + '）');
    }

    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (error) { data = null; }

    if (!response.ok) {
      const requestError = new Error((data && (data.error || data.message)) || ('HTTP ' + response.status));
      requestError.status = response.status;
      requestError.data = data;
      throw requestError;
    }
    return data;
  }

  function downloadText(text, name) {
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const anchor = el('a', { href: url, download: name });
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  async function repoDownload(pathname) {
    const token = repoToken();
    if (!token) throw new Error('还没有设置访问令牌');
    const response = await fetch(serverBase() + pathname, {
      headers: { Authorization: 'Bearer ' + token, 'ngrok-skip-browser-warning': 'true' }
    });
    if (!response.ok) {
      let message = 'HTTP ' + response.status;
      try {
        const data = await response.json();
        if (data && (data.error || data.message)) message = data.error || data.message;
      } catch (error) { /* 忽略 */ }
      throw new Error(message);
    }
    const blob = await response.blob();
    const disposition = response.headers.get('Content-Disposition') || '';
    const match = /filename\*=UTF-8''([^;]+)/i.exec(disposition);
    const name = match ? decodeURIComponent(match[1]) : 'skill_tree.zip';
    const url = URL.createObjectURL(blob);
    const anchor = el('a', { href: url, download: name });
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  // ---------------------------------------------------------------- 仓库界面

  function isRepoOpen() {
    return !dom.repoModal.classList.contains('hidden');
  }

  function setRepoStatus(text, kind) {
    dom.repoStatus.textContent = text;
    dom.repoStatus.className = 'status' + (kind ? ' ' + kind : '');
  }

  function formatTime(value) {
    if (!value) return '未知时间';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return date.toLocaleString('zh-CN', { hour12: false });
  }

  function openRepo() {
    dom.repoAuthor.value = repoAuthor();
    dom.repoServer.value = readLocal(SERVER_KEY);
    dom.repoToken.value = repoToken();
    dom.repoModal.classList.remove('hidden');

    repoState.selectedId = state.remote.treeId || repoState.selectedId;
    updateRepoWorkspace();

    if (!repoToken()) {
      dom.repoTrees.innerHTML = '';
      dom.repoTrees.append(el('div', { class: 'empty', text: '先填写访问令牌并点「保存设置」，再刷新列表。' }));
      dom.repoVersions.innerHTML = '';
      setRepoStatus('未设置令牌', '');
      return;
    }

    refreshTrees().catch(showRepoError);
    computeDirty().catch(() => undefined);
  }

  function closeRepo() {
    dom.repoModal.classList.add('hidden');
  }

  async function computeDirty() {
    if (!state.remote.treeId || !state.remote.lastSyncedHash) {
      repoState.dirty = null;
      updateRepoWorkspace();
      return;
    }
    repoState.dirty = (await hashCurrentTree()) !== state.remote.lastSyncedHash;
    updateRepoWorkspace();
  }

  function saveRepoConfig(silent) {
    const author = dom.repoAuthor.value.trim();
    const server = dom.repoServer.value.trim();
    const token = dom.repoToken.value.trim();

    if (server) {
      try {
        const url = new URL(server);
        if (!/^https?:$/.test(url.protocol)) throw new Error('protocol');
      } catch (error) {
        toast('服务器地址需要以 http:// 或 https:// 开头', 'error');
        return false;
      }
    }

    writeLocal(AUTHOR_KEY, author);
    writeLocal(SERVER_KEY, server.replace(/\/+$/, ''));
    writeLocal(TOKEN_KEY, token);
    if (!silent) toast('仓库设置已保存在本机', 'ok');
    updateRepoWorkspace();
    return true;
  }

  async function refreshTrees() {
    setRepoStatus('连接中…', '');
    const trees = await repoRequest('/api/trees');
    repoState.trees = Array.isArray(trees) ? trees : [];

    if (!repoState.selectedId && state.remote.treeId) repoState.selectedId = state.remote.treeId;
    if (repoState.selectedId && !repoState.trees.some(tree => tree.tree_id === repoState.selectedId)) {
      repoState.selectedId = '';
    }

    renderRepoTrees();

    if (!repoState.trees.length) {
      repoState.detail = null;
      repoState.versions = [];
      renderRepoVersions();
      updateRepoWorkspace();
      setRepoStatus('已连接', 'ok');
      return;
    }

    await selectRepoTree(repoState.selectedId || repoState.trees[0].tree_id);
    await computeDirty();
    setRepoStatus('已连接', 'ok');
  }

  async function selectRepoTree(treeId) {
    repoState.selectedId = treeId;
    renderRepoTrees();
    setRepoStatus('加载版本…', '');
    const detail = await repoRequest('/api/trees/' + encodeURIComponent(treeId) + '/versions');
    repoState.detail = detail;
    repoState.versions = Array.isArray(detail.versions) ? detail.versions : [];
    renderRepoVersions();
    updateRepoWorkspace();
    setRepoStatus('已连接', 'ok');
  }

  function renderRepoTrees() {
    dom.repoTreeCount.textContent = repoState.trees.length + ' 棵';
    dom.repoTrees.innerHTML = '';

    if (!repoState.trees.length) {
      dom.repoTrees.append(el('div', { class: 'empty', text: '仓库里还没有技能树。可以用下方按钮把当前工作区推送为新树。' }));
      return;
    }

    for (const tree of repoState.trees) {
      dom.repoTrees.append(el('div', {
        class: 'repo-tree' + (tree.tree_id === repoState.selectedId ? ' active' : ''),
        onclick: () => selectRepoTree(tree.tree_id).catch(showRepoError)
      },
        el('div', { class: 'name', text: tree.tree_name + ' · v' + tree.latest_version }),
        el('div', { class: 'line', text: '原作者：' + (tree.original_author || '未知') }),
        el('div', { class: 'line', text: '上传 ' + tree.upload_count + ' 次 · 最后 ' + formatTime(tree.last_uploaded_at) }),
        el('div', { class: 'line', text: tree.tree_id })
      ));
    }
  }

  function renderRepoVersions() {
    dom.repoVersions.innerHTML = '';
    if (!repoState.detail) {
      dom.repoSelectedName.textContent = '';
      dom.repoVersions.append(el('div', { class: 'empty', text: '在左侧选择一棵技能树，这里会列出它的所有版本。' }));
      return;
    }

    const detail = repoState.detail;
    dom.repoSelectedName.textContent = detail.tree_name + '（' + repoState.versions.length + ' 个版本）';

    for (const version of repoState.versions) {
      const isCurrent = state.remote.treeId === detail.tree_id && state.remote.baseVersion === version.version;
      dom.repoVersions.append(el('div', { class: 'repo-version' + (isCurrent ? ' current' : '') },
        el('div', { class: 'head' },
          el('span', { class: 'tag', text: 'v' + version.version + (version.version === detail.latest_version ? ' · 最新' : '') + (isCurrent ? ' · 工作区' : '') }),
          el('span', { class: 'muted-text', text: formatTime(version.edited_at) })
        ),
        version.message ? el('div', { class: 'msg', text: version.message }) : null,
        el('div', { class: 'line', text: '编辑者：' + (version.uploader || '未知') + ' · 上传于 ' + formatTime(version.uploaded_at) }),
        el('div', { class: 'line', text: '参与编辑：' + ((version.editors || []).join('、') || '未知') }),
        el('div', { class: 'btns' },
          el('button', {
            text: '拉取到工作区',
            onclick: () => pullVersion(detail.tree_id, version.version)
          }),
          el('button', {
            text: '下载 zip',
            onclick: () => downloadVersion(detail.tree_id, version.version, detail.tree_name)
          })
        )
      ));
    }
  }

  function updateRepoWorkspace() {
    const dirtyText = repoState.dirty === null ? '未计算' : (repoState.dirty ? '有未同步修改' : '与最近同步一致');
    const remoteText = state.remote.treeId
      ? '已关联 ' + state.remote.treeId + ' · 基于 v' + state.remote.baseVersion
      : '未关联远程树';

    dom.repoWorkspace.innerHTML = '';
    dom.repoWorkspace.append(
      el('div', {}, '当前工作区：', el('b', { text: state.displayName || '未命名' }), ' · ', el('b', { text: state.treeId }), ' · ', remoteText),
      el('div', {}, '作者：', el('b', { text: state.meta.originalAuthor || repoAuthor() || '未设置' }),
        ' · 工作区版本：', el('b', { text: state.meta.version ? 'v' + state.meta.version : '未上传' }),
        ' · ', dirtyText)
    );

    const latest = repoState.detail ? repoState.detail.latest_version : 0;
    const linked = !!repoState.detail && state.remote.treeId === repoState.detail.tree_id;
    const canPushVersion = linked && state.remote.baseVersion === latest;
    dom.repoPushVersion.disabled = !canPushVersion;
    dom.repoPushVersion.textContent = '推送当前工作区作为新版本' + (canPushVersion ? '（v' + (latest + 1) + '）' : '');
    dom.repoPushVersion.title = canPushVersion
      ? ''
      : (!linked ? '先在左侧选中当前工作区关联的那棵树' : '远端已有更新版本，请先拉取最新版本');
  }

  function showRepoError(error) {
    const message = error && error.message ? error.message : String(error);
    setRepoStatus('连接失败', '');
    toast(message, 'error');
    repoState.trees = [];
    repoState.detail = null;
    repoState.versions = [];
    dom.repoTrees.innerHTML = '';
    dom.repoTrees.append(el('div', { class: 'empty', text: '无法读取仓库：' + message }));
    renderRepoVersions();
  }

  // ---------------------------------------------------------------- 交互小工具

  function promptInput(title, label, defaultValue, multiline, allowEmpty) {
    return new Promise(resolve => {
      const input = multiline
        ? el('textarea', { rows: 4 })
        : el('input', { type: 'text', spellcheck: 'false' });
      input.value = defaultValue || '';
      setTimeout(() => input.focus(), 0);

      showModal(title, [el('div', { text: label }), input], [
        { label: '取消', action: () => resolve(null) },
        {
          label: '确定',
          primary: true,
          action: () => {
            const value = input.value.trim();
            if (!value && !allowEmpty) {
              toast('不能为空', 'error');
              return false;
            }
            resolve(value);
            return undefined;
          }
        }
      ]);
    });
  }

  function confirmDialog(title, text, warnings) {
    return new Promise(resolve => {
      const body = [el('div', { text })];
      if (warnings && warnings.length) {
        body.push(el('ul', { class: 'warn-list' }, warnings.map(item => el('li', { text: item }))));
      }
      showModal(title, body, [
        { label: '取消', action: () => resolve(false) },
        { label: '继续', primary: true, action: () => resolve(true) }
      ]);
    });
  }

  async function ensureAuthor() {
    const cached = repoAuthor();
    if (cached) return cached;
    const value = await promptInput('设置上传者 ID', '第一次上传需要填写你的名字，会记录在版本信息里。', '', false, false);
    if (value) writeLocal(AUTHOR_KEY, value);
    return value;
  }

  async function ensureToken() {
    const cached = repoToken();
    if (cached) return cached;
    const value = await promptInput('设置访问令牌', '请输入服务端配置的 EDITOR_TOKEN（只保存在本机浏览器）。', '', false, false);
    if (value) writeLocal(TOKEN_KEY, value);
    return value;
  }

  // ---------------------------------------------------------------- 上传

  function deriveFileName() {
    const parts = splitTreeId(state.treeId);
    return (parts ? parts.path.replace(/\//g, '_') : 'skill_tree') + '.json';
  }

  function backupWorkspace() {
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\..+$/, '');
    downloadText(JSON.stringify(buildTreeJson(), null, 2), deriveFileName().replace(/\.json$/i, '') + '_backup_' + stamp + '.json');
  }

  async function applyPushResult(response) {
    const meta = response.meta;
    state.meta = {
      originalAuthor: meta.original_author,
      version: meta.version,
      editors: Array.isArray(meta.editors) ? meta.editors.slice() : [],
      editedAt: meta.edited_at,
      message: meta.message
    };
    state.remote = {
      treeId: meta.tree_id,
      baseVersion: meta.version,
      lastSyncedHash: await hashCurrentTree()
    };
    repoState.dirty = false;
    save();
    if (isRepoOpen()) updateRepoWorkspace();
  }

  async function uploadWorkspace(mode, authorOverride) {
    const author = authorOverride || await ensureAuthor();
    if (!author) return;
    if (!await ensureToken()) return;

    const check = validateTree();
    if (check.errors.length) {
      showReport('无法上传：发现 ' + check.errors.length + ' 个问题', check.errors, check.warnings, null);
      return;
    }
    if (check.warnings.length && !await confirmDialog('上传前检查', '以下内容不会阻止上传：', check.warnings)) {
      return;
    }

    const message = await promptInput('版本说明', '写一句这次改动的说明（可留空）。', '', true, true);
    if (message === null) return;

    const now = new Date().toISOString();
    if (!state.meta.originalAuthor) state.meta.originalAuthor = author;
    state.meta.editedAt = now;
    state.meta.message = message;

    const payload = {
      tree: buildTreeJson(),
      name: state.displayName.trim() || '未命名技能树',
      original_author: state.meta.originalAuthor || author,
      uploader: author,
      message,
      edited_at: now,
      file_name: deriveFileName(),
      game_tree_id: state.treeId
    };

    try {
      let response;
      if (mode === 'new') {
        response = await repoRequest('/api/trees', { method: 'POST', body: payload });
      } else {
        if (!state.remote.treeId) throw new Error('当前工作区还没有关联远程树');
        response = await repoRequest(
          '/api/trees/' + encodeURIComponent(state.remote.treeId) + '/versions',
          { method: 'POST', body: Object.assign({}, payload, { expected_latest: state.remote.baseVersion }) }
        );
      }

      await applyPushResult(response);
      toast(mode === 'new' ? '已推送为新树 v' + response.version : '已推送新版本 v' + response.version, 'ok');
      repoState.selectedId = response.tree_id;
      if (isRepoOpen()) await refreshTrees();
    } catch (error) {
      if (error.status === 401) {
        toast('访问令牌不正确，请在仓库设置里检查', 'error');
        return;
      }
      if (error.status === 409) {
        const latest = error.data && error.data.latest_version;
        toast('远端已更新到 v' + (latest || '?') + '，请先拉取最新版本', 'error');
        if (isRepoOpen()) refreshTrees().catch(() => undefined);
        return;
      }
      toast('上传失败：' + error.message, 'error');
    }
  }

  /** 顶部「上传」：未关联远程则新建树，已关联则推送新版本 */
  async function quickUpload() {
    const author = await ensureAuthor();
    if (!author) return;
    if (!await ensureToken()) return;

    if (!state.remote.treeId) {
      if (!await confirmDialog('推送为新树', '当前工作区还没有关联远程树，将作为一棵新树上传。继续吗？', [])) return;
      await uploadWorkspace('new', author);
      return;
    }

    try {
      const detail = await repoRequest('/api/trees/' + encodeURIComponent(state.remote.treeId) + '/versions');
      if (detail.latest_version !== state.remote.baseVersion) {
        showModal('无法上传新版本', [
          el('div', { text: '远端已经有更新的版本 v' + detail.latest_version + '，而当前工作区基于 v' + state.remote.baseVersion + '。' }),
          el('div', { text: '请先在「仓库」里拉取最新版本再上传，或把当前工作区作为一棵新树推送。' })
        ], [
          { label: '取消' },
          { label: '作为新树推送', action: () => { uploadWorkspace('new', author); } }
        ]);
        return;
      }
    } catch (error) {
      toast('无法检查远端版本：' + error.message, 'error');
      return;
    }

    await uploadWorkspace('version', author);
  }

  // ---------------------------------------------------------------- 拉取与下载

  async function pullVersion(treeId, version) {
    let detail;
    try {
      detail = await repoRequest('/api/trees/' + encodeURIComponent(treeId) + '/versions/' + version);
    } catch (error) {
      toast('拉取失败：' + error.message, 'error');
      return;
    }

    showModal('拉取 v' + version + ' 到工作区', [
      el('div', {}, '目标：', el('b', { text: (detail.meta.tree_name || '技能树') + ' v' + version }),
        '（编辑者：' + (detail.meta.uploader || '未知') + '）'),
      detail.meta.message ? el('div', { class: 'cmd-summary', text: detail.meta.message }) : null,
      el('div', { class: 'section-title' }, el('span', {}, '如何处置当前工作区')),
      el('div', { text: '拉取会替换画布上的全部节点与连线。可以先导出当前工作区作为备份，再执行覆盖。' })
    ], [
      { label: '取消' },
      {
        label: '先备份再覆盖',
        action: () => {
          backupWorkspace();
          applyRemoteVersion(detail).catch(error => toast('拉取失败：' + error.message, 'error'));
        }
      },
      {
        label: '直接覆盖',
        danger: true,
        action: () => applyRemoteVersion(detail).catch(error => toast('拉取失败：' + error.message, 'error'))
      }
    ]);
  }

  async function applyRemoteVersion(detail) {
    applyTreeJson(detail.tree, detail.meta.file_name || null);
    if (detail.meta.game_tree_id) state.treeId = detail.meta.game_tree_id;
    state.meta = normalizeMeta(detail.tree.meta || {
      original_author: detail.meta.original_author,
      version: detail.meta.version,
      editors: detail.meta.editors,
      edited_at: detail.meta.edited_at,
      message: detail.meta.message
    });
    state.remote = {
      treeId: detail.meta.tree_id,
      baseVersion: detail.meta.version,
      lastSyncedHash: await hashCurrentTree()
    };
    repoState.dirty = false;
    syncSettings();
    save();
    toast('已拉取 v' + detail.meta.version + ' 到工作区', 'ok');
    if (isRepoOpen()) {
      updateRepoWorkspace();
      renderRepoVersions();
    }
  }

  async function downloadVersion(treeId, version, treeName) {
    try {
      await repoDownload('/api/trees/' + encodeURIComponent(treeId) + '/versions/' + version + '/download');
      toast('已开始下载 ' + treeName + ' v' + version + ' 的 zip', 'ok');
    } catch (error) {
      toast('下载失败：' + error.message, 'error');
    }
  }

  // ==========================================================================================
  // 本地持久化
  // ==========================================================================================

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        treeId: state.treeId,
        displayName: state.displayName,
        order: state.order,
        defaultUnlocked: state.defaultUnlocked,
        resetXpPerPoint: state.resetXpPerPoint,
        nodes: state.nodes,
        edges: state.edges,
        enums: state.enums,
        commands: Array.from(state.commands.values()),
        seq: state.seq,
        meta: state.meta,
        remote: state.remote
      }));
    } catch (error) {
      console.warn('保存到 localStorage 失败', error);
    }
  }

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (error) { raw = null; }
    if (!raw) return false;
    try {
      const data = JSON.parse(raw);
      state.treeId = typeof data.treeId === 'string' ? data.treeId : state.treeId;
      state.displayName = typeof data.displayName === 'string' ? data.displayName : state.displayName;
      state.order = Number.isInteger(data.order) ? data.order : 0;
      state.defaultUnlocked = data.defaultUnlocked === true;
      state.resetXpPerPoint = Number.isFinite(data.resetXpPerPoint) ? data.resetXpPerPoint : 0;
      state.nodes = Array.isArray(data.nodes) ? data.nodes : [];
      state.edges = Array.isArray(data.edges) ? data.edges : [];
      state.enums = (Array.isArray(data.enums) ? data.enums : []).map(normalizeEnum).filter(Boolean);
      state.seq = Number.isInteger(data.seq) ? data.seq : 1;
      state.meta = normalizeMeta(data.meta);
      state.remote = {
        treeId: data.remote && typeof data.remote.treeId === 'string' ? data.remote.treeId : '',
        baseVersion: data.remote && Number.isInteger(data.remote.baseVersion) ? data.remote.baseVersion : 0,
        lastSyncedHash: data.remote && typeof data.remote.lastSyncedHash === 'string' ? data.remote.lastSyncedHash : ''
      };
      if (Array.isArray(data.commands) && data.commands.length) {
        state.commands = new Map(data.commands.map(def => [def.id, def]));
      }
      return true;
    } catch (error) {
      console.warn('读取本地草稿失败', error);
      return false;
    }
  }

  // ==========================================================================================
  // 文件与按钮
  // ==========================================================================================

  document.getElementById('btn-defs').addEventListener('click', () => dom.fileDefs.click());
  document.getElementById('btn-enums').addEventListener('click', () => dom.fileEnums.click());
  document.getElementById('btn-import-tree').addEventListener('click', () => dom.fileTree.click());
  document.getElementById('btn-export').addEventListener('click', exportTree);
  document.getElementById('btn-help').addEventListener('click', showHelp);

  document.getElementById('btn-upload').addEventListener('click', () => {
    quickUpload().catch(error => toast('上传失败：' + error.message, 'error'));
  });
  document.getElementById('btn-repo').addEventListener('click', openRepo);
  document.getElementById('repo-close').addEventListener('click', closeRepo);
  document.getElementById('repo-save-config').addEventListener('click', () => {
    if (saveRepoConfig(false)) refreshTrees().catch(showRepoError);
  });
  document.getElementById('repo-refresh').addEventListener('click', () => {
    if (saveRepoConfig(true)) refreshTrees().catch(showRepoError);
  });
  document.getElementById('repo-push-new').addEventListener('click', () => {
    uploadWorkspace('new').catch(error => toast('上传失败：' + error.message, 'error'));
  });
  document.getElementById('repo-push-version').addEventListener('click', () => {
    if (dom.repoPushVersion.disabled) return;
    uploadWorkspace('version').catch(error => toast('上传失败：' + error.message, 'error'));
  });
  dom.repoModal.addEventListener('pointerdown', event => {
    if (event.target === dom.repoModal) closeRepo();
  });

  document.getElementById('btn-new').addEventListener('click', () => {
    showModal('新建技能树', [el('div', { text: '当前草稿会被清空，是否继续？' })], [
      { label: '取消' },
      {
        label: '新建', primary: true, action: () => {
          state.nodes = [];
          state.edges = [];
          state.selection = null;
          state.connect = null;
          state.treeId = DEFAULT_NAMESPACE + ':skill_tree';
          state.displayName = '技能树';
          state.order = 0;
          state.defaultUnlocked = false;
          state.resetXpPerPoint = 0;
          state.seq = 1;
          state.meta = { originalAuthor: repoAuthor(), version: 0, editors: [], editedAt: '', message: '' };
          state.remote = { treeId: '', baseVersion: 0, lastSyncedHash: '' };
          updateBanner();
          renderAll();
          fitView();
          save();
        }
      }
    ]);
  });

  dom.fileDefs.addEventListener('change', async () => {
    const file = dom.fileDefs.files && dom.fileDefs.files[0];
    dom.fileDefs.value = '';
    if (!file) return;
    try { loadDefinitions(await readJsonFile(file)); }
    catch (error) { toast(error.message, 'error'); }
  });

  dom.fileEnums.addEventListener('change', async () => {
    const files = Array.from(dom.fileEnums.files || []);
    dom.fileEnums.value = '';
    if (!files.length) return;
    try {
      for (const file of files) loadEnums(await readJsonFile(file), true);
      toast('已加载 ' + files.length + ' 个 enum 文件，共 ' + state.enums.length + ' 条表', 'ok');
    } catch (error) { toast(error.message, 'error'); }
  });

  dom.fileTree.addEventListener('change', async () => {
    const file = dom.fileTree.files && dom.fileTree.files[0];
    dom.fileTree.value = '';
    if (!file) return;
    try {
      applyTreeJson(await readJsonFile(file), file.name);
      toast('已导入技能树：' + file.name, 'ok');
    } catch (error) { toast(error.message, 'error'); }
  });

  // 直接把 JSON 拖进页面：自动识别命令定义 / enum 表 / 技能树
  function handleJsonObject(json, filename) {
    if (json && Array.isArray(json.commands)) { loadDefinitions(json); return true; }
    if (json && (Array.isArray(json.enums) || Array.isArray(json.values))) { loadEnums(json); return true; }
    if (json && Array.isArray(json.nodes)) { applyTreeJson(json, filename); toast('已导入技能树：' + filename, 'ok'); return true; }
    return false;
  }

  document.addEventListener('dragover', event => {
    if (event.dataTransfer && Array.from(event.dataTransfer.types).includes('Files')) event.preventDefault();
  });

  document.addEventListener('drop', async event => {
    const files = Array.from((event.dataTransfer && event.dataTransfer.files) || []);
    if (!files.length) return;
    event.preventDefault();
    for (const file of files) {
      try {
        const json = await readJsonFile(file);
        if (!handleJsonObject(json, file.name)) toast('无法识别文件：' + file.name, 'error');
      } catch (error) { toast(error.message, 'error'); }
    }
  });

  // ==========================================================================================
  // 启动
  // ==========================================================================================

  function boot() {
    const restored = load();
    loadBuiltins();
    renderLibrary();
    renderAll();
    updateBanner();
    applyView();
    if (state.nodes.length) fitView();

    if (!state.commands.size) {
      // 通过 http 打开时，尝试自动读取同目录的定义表；file:// 下会被浏览器拦截，忽略即可。
      fetch('./command_definitions.json', { cache: 'no-store' })
        .then(response => response.ok ? response.json() : null)
        .then(json => { if (json) loadDefinitions(json, true); })
        .catch(() => { /* 忽略：手动导入即可 */ });
    }

    if (!restored) {
      toast('提示：先导入命令定义，再把命令拖到画布上创建节点', 'ok');
    }
  }

  boot();
})();
</script>
</body>
</html>
