plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("src/generated/**/.cache") // datagen cache files
}

// 客户端专用源码集。必须先由 Gradle 创建，再由 neoForge.mods 触发 Minecraft client API 配置。
sourceSets {
    create('client') {
        java {
            srcDirs = ['src/client/java']
        }
        resources {
            srcDirs = ['src/client/resources']
        }
    }
}

repositories {
}

base {
    archivesName = mod_id
}

// Minecraft 26.3 ships Java 25, so mods must target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
        }
    }
}

// 26.3 的 GameTest 结构按数据包布局读取（gameteststructures/data/<ns>/structure/*.snbt），
// 且进程工作目录是 run/，因此构建时把源目录整体复制到 run/gameteststructures。
tasks.register('copyGameTestStructures', Copy) {
    from 'src/main/resources/gameteststructures'
    into 'run/gameteststructures'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'copyGameTestStructures'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // NeoForge 2.0.x 不会自动给手动创建的 sourceSet 传依赖，
    // 显式让 client 的编译/运行时 classpath 继承 main，才能拿到 Minecraft/NeoForge API。
    clientCompileClasspath.extendsFrom compileClasspath
    clientRuntimeClasspath.extendsFrom runtimeClasspath
}

// client 还需要 main 编译产物（SkillTreeClientData 等在 main 里，client 里的 SkillTreeClient 会引用它们）
sourceSets.client.compileClasspath += sourceSets.main.output

dependencies {
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 移植期需要一次性看到完整的破损清单，而不是被 javac 默认的 100 条截断
    options.compilerArgs += ['-Xmaxerrs', '3000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
